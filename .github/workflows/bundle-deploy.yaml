name: Bundle and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  bundle-deploy:
    name: Bundle and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc

      - name: Bundle Extension
        run: npm run bundle

      # Paperback runs JavaScriptCore, which has no Node globals. A dependency
      # that touches one at module scope kills the whole source on device while
      # working fine under Node, so the bundle is evaluated in a bare VM here.
      - name: Verify bundle evaluates without Node globals
        run: node tools/jsc-sim.cjs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: bundles
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
